<!doctype html><html lang="ru"><head><meta charset="utf-8"><script src="qrc:///qtwebchannel/qwebchannel.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#ee6b2f #171c23}body{margin:0;padding:clamp(12px,2vw,24px);background:#101216;color:#f5f7fa;font:15px "Segoe UI",sans-serif}.panel{min-height:calc(100vh - 24px);padding:clamp(18px,2.4vw,28px);border:1px solid #303744;border-radius:20px;background:linear-gradient(135deg,#1c212a,#15181e)}h1{margin:0;color:#ff6b5f;font-size:28px}.lead,.hint{color:#aeb7c5;line-height:1.45}.lead{margin:8px 0 24px}.hint{margin:6px 0;font-size:13px}.field{margin:16px 0}label{display:block;margin-bottom:7px;font-weight:650}.path,.actions{display:flex;gap:10px;align-items:center}input,select{width:100%;min-height:43px;padding:10px 12px;border:1px solid #3b4553;border-radius:10px;background:#101216;color:#f5f7fa;font:14px "Segoe UI",sans-serif;outline:none}input:focus,select:focus{border-color:#ff6b5f;box-shadow:0 0 0 3px #ff6b5f25}button{border:0;border-radius:10px;padding:11px 16px;background:#ee6b2f;color:#fff;font:700 14px "Segoe UI",sans-serif;cursor:pointer}button:hover{background:#ff814a}button.secondary{background:#2b323d;border:1px solid #46505f}.status{min-height:22px;color:#aeb7c5}.status.error{color:#ff9b95}.result{display:none;margin-top:18px;padding:15px;border:1px solid #3c8c67;border-radius:12px;background:#17251d;color:#c5f5d0}.result.error{border-color:#b94b52;background:#351d23;color:#ffd0d0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:650px){.path,.actions{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head><body><main class="panel"><h1>Combo Preset Creator</h1><p class="lead" id="lead"></p><section><div class="field"><label id="pathLabel" for="gamePath"></label><div class="path"><input id="gamePath" spellcheck="false"><button class="secondary" id="browse" type="button"></button></div><p class="hint" id="pathHint"></p></div><div class="actions"><button id="findProfiles" type="button"></button><span id="status" class="status"></span></div></section><section id="details" hidden><div class="field"><label id="profileLabel" for="profile"></label><select id="profile"></select></div><div class="grid"><div class="field"><label id="idLabel" for="presetId"></label><input id="presetId" spellcheck="false"></div><div class="field"><label id="nameLabel" for="presetName"></label><input id="presetName" spellcheck="false"></div></div><div class="field"><label id="afterLabel" for="ownAfter"></label><select id="ownAfter"></select></div><div class="field"><label id="blockedLabel" for="blocked"></label><input id="blocked" spellcheck="false"></div><p class="hint" id="verificationHint"></p><div class="actions"><button id="create" type="button"></button></div></section><section id="result" class="result"></section></main><script>
let toolBridge,lang='ru',loadedMods=[];const $=id=>document.getElementById(id);const text={ru:{lead:'Создайте готовый пресет для Combo Installer на основе активных модов профиля. Данные проверки берутся из game.log.txt автоматически.',path:'Локальная папка Euro Truck Simulator 2',pathHint:'Нужны папки profiles и mod, а также game.log.txt после загрузки сохранения.',browse:'Обзор…',find:'Найти профили',finding:'Поиск профилей…',profile:'Профиль',choose:'Выберите профиль',id:'ID пресета',name:'Название пресета',after:'После какого мода ставить свои моды',chooseAfter:'Выберите мод',blocked:'Несовместимые слова (через запятую)',verification:'Верификация добавляется только если мод найден и в game.log.txt, и в папке mod. Остальные моды попадут в пресет без верификации и Combo Installer пропустит их при проверке.',create:'Создать пресет',creating:'Создание пресета…',found:'Профилей найдено: ',saved:'Пресет создан: ',mods:'Модов в пресете: ',verified:'С верификацией: ',skipped:'Без верификации: ',errors:{game_folder_not_found:'Папка игры не найдена.',profiles_folder_not_found:'Папка profiles не найдена.',no_profiles:'Профили не найдены.',profile_not_found:'Профиль не найден.',profile_read_failed:'Не удалось прочитать profile.sii.',preset_id_invalid:'Укажите ID: латинские буквы, цифры, дефис, подчёркивание или точка.',preset_name_required:'Укажите название пресета.',own_mod_after_required:'Выберите мод, после которого будут стоять свои моды.',preset_write_failed:'Не удалось записать пресет.',generic:'Не удалось выполнить операцию.'}},en:{lead:'Create a ready-to-use Combo Installer preset from a profile’s active mods. Verification data is read from game.log.txt automatically.',path:'Euro Truck Simulator 2 local folder',pathHint:'The profiles and mod folders are required, along with game.log.txt after loading a save.',browse:'Browse…',find:'Find profiles',finding:'Finding profiles…',profile:'Profile',choose:'Select a profile',id:'Preset ID',name:'Preset name',after:'Place your own mods after',chooseAfter:'Select a mod',blocked:'Blocked keywords (comma-separated)',verification:'Verification is added only when a mod is found in both game.log.txt and the mod folder. Other mods are kept without verification and Combo Installer skips them during checking.',create:'Create preset',creating:'Creating preset…',found:'Profiles found: ',saved:'Preset created: ',mods:'Mods in preset: ',verified:'With verification: ',skipped:'Without verification: ',errors:{game_folder_not_found:'The game folder was not found.',profiles_folder_not_found:'The profiles folder was not found.',no_profiles:'No profiles were found.',profile_not_found:'The profile was not found.',profile_read_failed:'profile.sii could not be read.',preset_id_invalid:'Enter an ID using letters, digits, hyphen, underscore, or dot.',preset_name_required:'Enter a preset name.',own_mod_after_required:'Select the mod after which your own mods are placed.',preset_write_failed:'The preset could not be written.',generic:'The operation could not be completed.'}}};function t(){return text[lang]||text.en}function render(){const x=t();$('lead').textContent=x.lead;$('pathLabel').textContent=x.path;$('pathHint').textContent=x.pathHint;$('browse').textContent=x.browse;$('findProfiles').textContent=x.find;$('profileLabel').textContent=x.profile;$('idLabel').textContent=x.id;$('nameLabel').textContent=x.name;$('afterLabel').textContent=x.after;$('blockedLabel').textContent=x.blocked;$('verificationHint').textContent=x.verification;$('create').textContent=x.create}window.setLanguage=value=>{lang=text[value]?value:'en';render();if($('profile').options.length)fillAfter()};function escape(v){const s=document.createElement('span');s.textContent=v;return s.innerHTML}function busy(message){$('status').textContent=message;$('status').className='status';$('findProfiles').disabled=true;$('create').disabled=true}function ready(){ $('findProfiles').disabled=false;$('create').disabled=false}function fillAfter(){const selected=$('ownAfter').value,x=t();$('ownAfter').innerHTML='<option value="">'+escape(x.chooseAfter)+'</option>'+loadedMods.map(item=>'<option value="'+escape(item.sii_value)+'">'+escape(item.name)+'</option>').join('');$('ownAfter').value=selected}function response(data){ready();if(data.status!=='ok'){const message=t().errors[data.code]||t().errors.generic;$('status').textContent=message;$('status').className='status error';return}if(data.action==='scan_profiles'){const x=t();$('profile').innerHTML='<option value="">'+escape(x.choose)+'</option>'+data.profiles.map(p=>'<option value="'+escape(p.directory)+'">'+escape(p.name)+'</option>').join('');$('details').hidden=false;$('status').textContent=x.found+data.profiles.length;return}if(data.action==='read_profile'){loadedMods=data.mods||[];fillAfter();return}if(data.action==='create_preset'){const x=t();$('result').style.display='block';$('result').className='result';$('result').innerHTML='<strong>'+escape(x.saved)+escape(data.path)+'</strong><p>'+x.mods+data.mod_count+'<br>'+x.verified+data.verified_count+'<br>'+x.skipped+data.skipped_count+'</p>';$('status').textContent=x.saved+data.id}}$('browse').onclick=()=>toolBridge.browse('source_folder',t().path,p=>{if(p)$('gamePath').value=p});$('findProfiles').onclick=()=>{busy(t().finding);toolBridge.run(JSON.stringify({action:'scan_profiles',game_path:$('gamePath').value.trim()}))};$('profile').onchange=()=>{if(!$('profile').value)return;busy(t().finding);toolBridge.run(JSON.stringify({action:'read_profile',game_path:$('gamePath').value.trim(),profile_dir:$('profile').value}))};$('create').onclick=()=>{busy(t().creating);toolBridge.run(JSON.stringify({action:'create_preset',game_path:$('gamePath').value.trim(),profile_dir:$('profile').value,id:$('presetId').value.trim(),name:$('presetName').value.trim(),own_mod_after:$('ownAfter').value,blocked_keywords:$('blocked').value}))};new QWebChannel(qt.webChannelTransport,c=>{toolBridge=c.objects.toolBridge;render();toolBridge.run(JSON.stringify({action:'defaults'}))});const base=response;window.renderTool=data=>{if(data.status==='defaults'){$('gamePath').value=data.game_path||'';ready();return}base(data)};
</script><script>
let presetCreatorStatus=null,presetCreatorResult=null;
function renderPresetCreatorDynamic(){const x=t(),status=$('status'),result=$('result');if(presetCreatorStatus){status.className='status'+(presetCreatorStatus.error?' error':'');if(presetCreatorStatus.key==='finding')status.textContent=x.finding;else if(presetCreatorStatus.key==='creating')status.textContent=x.creating;else if(presetCreatorStatus.key==='found')status.textContent=x.found+presetCreatorStatus.count;else if(presetCreatorStatus.key==='saved')status.textContent=x.saved+presetCreatorStatus.id;else if(presetCreatorStatus.key==='error')status.textContent=x.errors[presetCreatorStatus.code]||x.errors.generic}if(presetCreatorResult){result.style.display='block';result.className='result';result.innerHTML='<strong>'+escape(x.saved)+escape(presetCreatorResult.path)+'</strong><p>'+x.mods+presetCreatorResult.mod_count+'<br>'+x.verified+presetCreatorResult.verified_count+'<br>'+x.skipped+presetCreatorResult.skipped_count+'</p>'}}
const presetCreatorLanguage=window.setLanguage;window.setLanguage=value=>{presetCreatorLanguage(value);renderPresetCreatorDynamic()};
const presetCreatorResponse=window.renderTool;window.renderTool=data=>{presetCreatorResponse(data);if(data.status!=='ok'&&data.status!=='defaults')presetCreatorStatus={key:'error',code:data.code,error:true};else if(data.action==='scan_profiles')presetCreatorStatus={key:'found',count:(data.profiles||[]).length};else if(data.action==='create_preset'){presetCreatorStatus={key:'saved',id:data.id};presetCreatorResult=data}renderPresetCreatorDynamic()};
$('findProfiles').onclick=()=>{presetCreatorStatus={key:'finding'};renderPresetCreatorDynamic();$('findProfiles').disabled=true;$('create').disabled=true;toolBridge.run(JSON.stringify({action:'scan_profiles',game_path:$('gamePath').value.trim()}))};
$('profile').onchange=()=>{if(!$('profile').value)return;presetCreatorStatus={key:'finding'};renderPresetCreatorDynamic();$('findProfiles').disabled=true;$('create').disabled=true;toolBridge.run(JSON.stringify({action:'read_profile',game_path:$('gamePath').value.trim(),profile_dir:$('profile').value}))};
$('create').onclick=()=>{presetCreatorStatus={key:'creating'};renderPresetCreatorDynamic();$('findProfiles').disabled=true;$('create').disabled=true;toolBridge.run(JSON.stringify({action:'create_preset',game_path:$('gamePath').value.trim(),profile_dir:$('profile').value,id:$('presetId').value.trim(),name:$('presetName').value.trim(),own_mod_after:$('ownAfter').value,blocked_keywords:$('blocked').value}))};
$('status').style.marginLeft='8px';
</script><script>
/* Keep the entire draft: this also preserves the already-found profile list
   and therefore its count after the tool is closed and opened again. */
let savedCreatorProfiles=[];let creatorStateTimer=null;
function currentCreatorState(){return {game_path:$('gamePath').value.trim(),profiles:savedCreatorProfiles,profile_dir:$('profile').value,id:$('presetId').value,name:$('presetName').value,own_mod_after:$('ownAfter').value,blocked_keywords:$('blocked').value,mods:loadedMods}}
function queueCreatorStateSave(){clearTimeout(creatorStateTimer);creatorStateTimer=setTimeout(()=>{if(toolBridge&&toolBridge.run)toolBridge.run(JSON.stringify({action:'save_state',state:currentCreatorState()}))},180)}
function restoreCreatorState(state){if(!state||typeof state!=='object')return;$('presetId').value=state.id||'';$('presetName').value=state.name||'';$('blocked').value=state.blocked_keywords||'';savedCreatorProfiles=Array.isArray(state.profiles)?state.profiles:[];loadedMods=Array.isArray(state.mods)?state.mods:[];if(savedCreatorProfiles.length){$('profile').innerHTML='<option value="">'+escape(t().choose)+'</option>'+savedCreatorProfiles.map(item=>'<option value="'+escape(item.directory)+'">'+escape(item.name)+'</option>').join('');$('details').hidden=false;$('profile').value=state.profile_dir||'';fillAfter();$('ownAfter').value=state.own_mod_after||'';presetCreatorStatus={key:'found',count:savedCreatorProfiles.length};renderPresetCreatorDynamic()}}
const creatorPersistenceResponse=window.renderTool;window.renderTool=data=>{creatorPersistenceResponse(data);if(data.status==='defaults'){restoreCreatorState(data.state)}else if(data.action==='scan_profiles'&&data.status==='ok'){savedCreatorProfiles=data.profiles||[];queueCreatorStateSave()}else if(data.action==='read_profile'&&data.status==='ok'){loadedMods=data.mods||[];const savedOwn=$('ownAfter').value;fillAfter();if(savedOwn)$('ownAfter').value=savedOwn;queueCreatorStateSave()}};
['gamePath','presetId','presetName','blocked','profile','ownAfter'].forEach(id=>$(id).addEventListener(id==='profile'||id==='ownAfter'?'change':'input',queueCreatorStateSave));
</script><script src="scroll_enhancements.js"></script></body></html>
